<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Cattle Claim Validator</title>
<style>
  body{background:#12160f;color:#eef1ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
  .box{background:#1b1f17;border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:28px;width:100%;max-width:320px;}
  h1{font-size:18px;margin:0 0 20px;}
  input{width:100%;padding:11px;margin-bottom:12px;border-radius:9px;border:1px solid rgba(255,255,255,0.14);
    background:#232a1c;color:#eef1ea;font-size:14px;box-sizing:border-box;}
  button{width:100%;padding:12px;border:none;border-radius:9px;background:#8CC63F;color:#0e1509;
    font-weight:700;font-size:14px;cursor:pointer;}
  #error{color:#e2574c;font-size:13px;margin-top:10px;min-height:16px;}
</style>
</head>
<body>
  <div class="box">
    <h1>🐄 Cattle Claim Validator</h1>
    <input type="text" id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Log In</button>
    <div id="error"></div>
  </div>
<script>
async function doLogin(){
  const formData = new FormData();
  formData.append('username', document.getElementById('username').value);
  formData.append('password', document.getElementById('password').value);
  const resp = await fetch('/api/auth/login', { method: 'POST', body: formData });
  const data = await resp.json();
  if(data.ok){
    window.location.href = './index.html';
  } else {
    document.getElementById('error').textContent = data.error || 'Login failed';
  }
}
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', (e) => { if(e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
